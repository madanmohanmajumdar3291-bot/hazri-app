name: Publish APK release

# Copies an APK built on EAS into a permanent GitHub Release, because EAS
# internal-distribution artifact links expire after 14 days.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: EAS artifact URL of the APK
        required: true
      tag:
        description: Release tag, e.g. v1.0.1
        required: true
      title:
        description: Release title
        required: true
      notes:
        description: Release notes (optional)
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Inputs are passed through env, never pasted into the script, so a
      # crafted tag or title can't run shell commands.
      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          case "$APK_URL" in
            https://*) ;;
            *) echo "APK URL must be an https link"; exit 1 ;;
          esac
          curl -fSL -o hazri.apk "$APK_URL"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "$TAG" hazri.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "${NOTES:-Built on EAS from $GITHUB_SHA.}" \
            --latest
