name: Publish APK release

# Copies an APK built on EAS into a permanent GitHub Release, because EAS
# internal-distribution artifact links expire after 14 days.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: EAS artifact URL of the APK
        required: true
      tag:
        description: Release tag, e.g. v1.0.1
        required: true
      title:
        description: Release title
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        run: curl -fSL -o hazri.apk "${{ inputs.apk_url }}"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" hazri.apk \
            --repo "${{ github.repository }}" \
            --title "${{ inputs.title }}" \
            --notes "Fixes Google Drive backup sign-in. Built on EAS from ${{ github.sha }}." \
            --latest
